<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Video Automatico</title>
</head>
<body>
    <div class="container">        
        <div>
            <h3>Gerador De Vídeo Automático - V2</h3>
            <label>Arquivo MP3:</label><br>
            <input type="file" id="audioInput" accept=".mp3" placeholder="Insira o arquivo de áudio mp3"><br>
            <label>Arquivo MP4:</label><br>
            <input type="file" id="videoInput" accept=".mp4" placeholder="Insira o arquivo de vídeo mp4"><br>
        </div>
        <div class="preview-container">
            <canvas id="previewCanvas"></canvas>
            <video id="overlayVideo" muted autoplay loop playsinline>
    </video>
        </div>  
        <div>
            <button class="btExportar">Exportar Vídeo</button>
        </div>        
    </div>

<script src="js/app.js"></script>

</body>
</html>
